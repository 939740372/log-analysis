[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "log-analysis"
version = "0.1.0"
description = "Two-stage Java log analysis CLI with LLM-backed summaries and code-linked fix suggestions."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "OpenAI Codex" }
]
dependencies = []

[project.scripts]
analyze-logs = "log_analysis.cli:main"
analyze-logs-react = "log_analysis.react_cli:main"
analyze-logs-web = "log_analysis.web_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
